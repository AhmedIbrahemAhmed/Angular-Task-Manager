<div class="carousel-container">
   <div class="carousel-slide">
    <img src = "./images/left-arrow.png" alt="Carousel Image" width="100px" height="100px" (click)="prev()" />
    <img [src]="items[currentIndex]" alt="Carousel Image" width="500px" height="500px" />
    <img src = "./images/right-arrow.png" alt="Carousel Image" width="100px" height="100px" (click)="next()" />

   </div>


    <div class="carousel-indicators">
        @for (item of items; track $index) {
                <img 
                    class="indicator" 
                    [class.active]="$index === currentIndex" 
                    (click)="currentIndex = $index" 
                    src="./images/oval.png" 
                />
        }
    </div>
    <div class="slideShow">
        <button value = "slideshow" (click) = "slideshow()">slideshow</button>
        <button value="stop" (click) = "stop()">stop</button>
    </div>
</div>
